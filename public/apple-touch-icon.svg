<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#1A1D2E"/>

  <!-- Anvil base -->
  <rect x="28" y="124" width="124" height="28" rx="8" fill="#FF6B35"/>
  <!-- Anvil body -->
  <rect x="46" y="96" width="90" height="32" rx="6" fill="#FF6B35"/>
  <!-- Anvil horn taper (left) -->
  <path d="M46 96 L28 112 L46 128 Z" fill="#C1440E"/>
  <!-- Anvil top face -->
  <rect x="34" y="78" width="112" height="22" rx="6" fill="#FFB800"/>

  <!-- Hammer handle -->
  <rect x="72" y="40" width="14" height="56" rx="5" fill="#2D3142" transform="rotate(-35 79 68)"/>
  <!-- Hammer head -->
  <rect x="90" y="20" width="44" height="26" rx="6" fill="#4F5D75" transform="rotate(-35 112 33)"/>
  <!-- Hammer face highlight -->
  <rect x="92" y="22" width="40" height="10" rx="4" fill="#6B7A94" transform="rotate(-35 112 27)"/>

  <!-- Sparks -->
  <circle cx="76" cy="66" r="6" fill="#FFB800" opacity="0.95"/>
  <circle cx="60" cy="54" r="4" fill="#FF6B35" opacity="0.85"/>
  <circle cx="88" cy="50" r="3" fill="#FFB800" opacity="0.75"/>
  <circle cx="50" cy="70" r="3" fill="#FF6B35" opacity="0.7"/>
  <circle cx="68" cy="44" r="2.5" fill="#FFB800" opacity="0.6"/>
  <circle cx="46" cy="58" r="2" fill="#FF6B35" opacity="0.5"/>

  <!-- "forge" wordmark -->
  <text x="90" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FF6B35" text-anchor="middle" letter-spacing="3">forge</text>
</svg>
