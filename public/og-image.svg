<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1D2E"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#2D3142" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#2D3142" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#2D3142" stroke-width="1" opacity="0.4"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#2D3142" stroke-width="1" opacity="0.4"/>

  <!-- Glow behind anvil -->
  <ellipse cx="900" cy="340" rx="260" ry="200" fill="url(#forgeGlow)"/>

  <!-- ======================== ANVIL ======================== -->
  <!-- Anvil base -->
  <rect x="730" y="390" width="340" height="76" rx="12" fill="#FF6B35"/>
  <!-- Anvil body -->
  <rect x="770" y="316" width="260" height="84" rx="8" fill="#FF6B35"/>
  <!-- Anvil left horn -->
  <path d="M770 316 L730 358 L770 390 Z" fill="#C1440E"/>
  <!-- Anvil top face -->
  <rect x="740" y="284" width="320" height="40" rx="8" fill="#FFB800"/>
  <!-- Anvil top highlight -->
  <rect x="748" y="284" width="304" height="14" rx="6" fill="#FFC933" opacity="0.6"/>

  <!-- Hammer handle -->
  <rect x="860" y="140" width="18" height="160" rx="7" fill="#2D3142" transform="rotate(-38 869 220)"/>
  <!-- Hammer head -->
  <rect x="880" y="110" width="110" height="60" rx="10" fill="#4F5D75" transform="rotate(-38 935 140)"/>
  <!-- Hammer face highlight -->
  <rect x="884" y="112" width="102" height="22" rx="7" fill="#6B7A94" transform="rotate(-38 935 123)"/>
  <!-- Hammer bottom edge shadow -->
  <rect x="884" y="148" width="102" height="8" rx="4" fill="#3A4660" transform="rotate(-38 935 152)"/>

  <!-- Sparks -->
  <circle cx="820" cy="270" r="10" fill="#FFB800" opacity="0.95"/>
  <circle cx="790" cy="240" r="7" fill="#FF6B35" opacity="0.85"/>
  <circle cx="845" cy="248" r="5" fill="#FFB800" opacity="0.8"/>
  <circle cx="768" cy="260" r="5" fill="#FF6B35" opacity="0.7"/>
  <circle cx="808" cy="228" r="4" fill="#FFB800" opacity="0.65"/>
  <circle cx="756" cy="274" r="3.5" fill="#FF6B35" opacity="0.55"/>
  <circle cx="830" cy="218" r="3" fill="#FFB800" opacity="0.5"/>
  <circle cx="774" cy="224" r="2.5" fill="#FF6B35" opacity="0.4"/>
  <!-- Spark streaks -->
  <line x1="820" y1="270" x2="800" y2="246" stroke="#FFB800" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="820" y1="270" x2="842" y2="250" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="820" y1="270" x2="778" y2="258" stroke="#FFB800" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- ======================== LEFT SIDE TEXT ======================== -->
  <!-- Logo row -->
  <!-- Anvil mini icon -->
  <rect x="70" y="82" width="36" height="36" rx="8" fill="#FF6B35" opacity="0.2"/>
  <rect x="70" y="82" width="36" height="36" rx="8" stroke="#FF6B35" stroke-width="1.5" opacity="0.5"/>
  <text x="88" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#FF6B35" text-anchor="middle">⚒</text>
  <!-- forge wordmark -->
  <text x="118" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FF6B35" letter-spacing="2">forge</text>
  <!-- Pre-Alpha badge -->
  <rect x="220" y="88" width="90" height="22" rx="11" fill="#FFB800" opacity="0.15"/>
  <rect x="220" y="88" width="90" height="22" rx="11" stroke="#FFB800" stroke-width="1" opacity="0.4"/>
  <text x="265" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFB800" text-anchor="middle" letter-spacing="1">PRE-ALPHA</text>

  <!-- Main headline -->
  <text x="70" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Forged,</text>
  <text x="70" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#F5F5F5" letter-spacing="-1">not assembled.</text>

  <!-- Subheading -->
  <text x="70" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#4F5D75">The Rust-powered full-stack JS framework</text>
  <text x="70" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#4F5D75">where the compiler is the contract.</text>

  <!-- Divider -->
  <line x1="70" y1="446" x2="580" y2="446" stroke="#2D3142" stroke-width="1.5"/>

  <!-- Bottom stat pills -->
  <!-- Pill 1 -->
  <rect x="70" y="462" width="148" height="36" rx="18" fill="#06D6A0" opacity="0.1"/>
  <rect x="70" y="462" width="148" height="36" rx="18" stroke="#06D6A0" stroke-width="1" opacity="0.4"/>
  <text x="144" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#06D6A0" text-anchor="middle">Zero dep hell</text>

  <!-- Pill 2 -->
  <rect x="232" y="462" width="148" height="36" rx="18" fill="#FF6B35" opacity="0.1"/>
  <rect x="232" y="462" width="148" height="36" rx="18" stroke="#FF6B35" stroke-width="1" opacity="0.4"/>
  <text x="306" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FF6B35" text-anchor="middle">Oxc compiler</text>

  <!-- Pill 3 -->
  <rect x="394" y="462" width="168" height="36" rx="18" fill="#FFB800" opacity="0.1"/>
  <rect x="394" y="462" width="168" height="36" rx="18" stroke="#FFB800" stroke-width="1" opacity="0.4"/>
  <text x="478" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFB800" text-anchor="middle">TC39 Signals</text>

  <!-- Domain -->
  <text x="70" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#4F5D75" letter-spacing="1">forgejs.com</text>

  <!-- Orange accent bar at bottom -->
  <rect x="0" y="618" width="1200" height="4" fill="url(#titleGrad)" opacity="0.6"/>
  <!-- Orange accent bar at left -->
  <rect x="0" y="0" width="4" height="630" fill="url(#titleGrad)" opacity="0.6"/>
</svg>
