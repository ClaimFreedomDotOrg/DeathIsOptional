<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a96e"/>
      <stop offset="50%" stop-color="#f0d9a8"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c8a96e" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c8a96e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>

  <!-- Radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#c8a96e" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top label -->
  <text
    x="600"
    y="148"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="6"
    fill="#c8a96e"
    text-anchor="middle"
    opacity="0.7"
  >JESHUA BEN JOSEPH · APRIL 2026</text>

  <!-- Main title: DEATH -->
  <text
    x="600"
    y="290"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="148"
    font-weight="900"
    fill="url(#gold)"
    text-anchor="middle"
    letter-spacing="-4"
  >DEATH</text>

  <!-- Main title: IS OPTIONAL -->
  <text
    x="600"
    y="400"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="100"
    font-weight="900"
    fill="#f0ede8"
    text-anchor="middle"
    letter-spacing="-3"
  >IS OPTIONAL.</text>

  <!-- Divider -->
  <line x1="240" y1="436" x2="960" y2="436" stroke="url(#divider)" stroke-width="1"/>

  <!-- Subtitle -->
  <text
    x="600"
    y="490"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="400"
    fill="#6a6460"
    text-anchor="middle"
  >Fear → DMN → Cortisol → Telomere Destruction → Quantum Decoherence → Death</text>

  <!-- Bottom line -->
  <text
    x="600"
    y="534"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="19"
    font-weight="500"
    fill="#c8a96e"
    text-anchor="middle"
    opacity="0.6"
  >Remove fear. Reverse every step. deathisoptional.org</text>
</svg>
